<text x='400.0' y='253' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#424242' font-weight='normal' text-anchor='start'>Ocurrió un problema al comunicarse con el servidor. Tus datos se conservan; inténtalo de nuevo.</text>
